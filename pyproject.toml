[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdo-compose"
version = "0.1.0"
description = "Render a dashboard FAIR Digital Object as a web page: its panels, settings and style come from annotations in ROHub"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anne Fouilloux", email = "anne.fouilloux@lifewatch.eu" }]
dependencies = [
  "jinja2>=3.1",
  "fdo-consume @ git+https://github.com/annefou/fdo-consume.git@cca-dashboard-profile",
]

[project.scripts]
fdo-compose = "fdo_compose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdo_compose = ["templates/*.j2", "static/*", "contracts/*.yaml"]
