# The FAIR Climate Matchmaker space, read through published queries.
# Live: https://annefou.github.io/fdo-compose/?fdo=https%3A%2F%2Fw3id.org%2Fro-id%2F5e0f9468-7a2b-4396-a1c0-5152cf923300
id: 5e0f9468-7a2b-4396-a1c0-5152cf923300
title: FAIR Climate Matchmaker (dashboard composed from FAIR Digital Objects)
description: >
  A reading of the FAIR Climate Matchmaker space (https://w3id.org/spaces/fairclimatematchmaker)
  whose arrangement is described by this Research Object: which published queries to run, on which
  page, and how to show their results. The content is not copied here - each panel runs a grlc query
  nanopublication against the nanopublication network when the page is opened, so what a visitor
  reads is whatever the community has published by then. Experimental, FAIR2Adapt.
research_areas: [Earth Sciences]
access: PUBLIC

