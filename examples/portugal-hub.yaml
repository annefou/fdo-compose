id: d5f638ff-35a8-4481-824c-3adfad07f187
title: Portugal Adaptation Knowledge Dashboard (composed from FAIR Digital Objects)
description: >
  A hub for climate adaptation knowledge in Portugal whose website is described by this Research
  Object: its pages and panels are annotations, its words and colours are files, and the
  publications it lists are its resources. It carries the same three publication FAIR Digital
  Objects and the same brand as the CS4 prototype, so that the two can be compared.
research_areas: [Earth Sciences]
access: PUBLIC

