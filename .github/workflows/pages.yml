name: Build and publish the example pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"          # Mondays: pick up changes made to the objects in ROHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DASHBOARD_PID: https://w3id.org/ro-id/0391206f-3399-458f-b6b8-f6048c36c5b5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install git+https://github.com/annefou/fdo-consume.git@cca-dashboard-profile
          pip install .
      - name: Build the pages from the objects in ROHub
        run: fdo-compose "$DASHBOARD_PID" -o site --refresh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
