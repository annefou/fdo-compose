contract_id: dashboard-site-v1
version: 1
consumer:
  service: "fdo-compose"
  capability: "render a dashboard FDO as a web page: what it accepts, what it shows, its panels and its style"
needs:
  - term: accepts
    level: must
    reason: "The kind of object the dashboard renders; a page cannot be built without it."
  - term: shows
    level: should
    reason: "The PID of the dataset FDO this dashboard is bound to; absent in a template."
  - term: panel1
    level: should
    reason: "The first panel; a dashboard with no panel renders nothing."
  - term: panel2
    level: should
    reason: "Further panels of the dashboard, in order."
  - term: panel3
    level: should
    reason: "Further panels of the dashboard, in order."
  - term: primary_color
    level: should
    reason: "The dashboard's colour, so a fork can be recognised at a glance."
